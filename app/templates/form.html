{% extends 'base.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 600px;
        margin: 32px auto;
        padding: 24px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .form-title {
        text-align: center;
        font-size: 1.8rem;
        color: #2c3e50;
        margin-bottom: 28px;
        font-weight: 600;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #2d3748;
    }

    .form-control {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #cbd5e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        background-color: #f9fafb;
    }

    .form-control:focus {
        outline: none;
        border-color: #27ae60;
        box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.15);
        background-color: #fff;
    }

    textarea.form-control {
        min-height: 80px;
        resize: vertical;
    }

    .form-actions {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin-top: 24px;
    }

    .btn-submit {
        background-color: #27ae60;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .btn-submit:hover {
        background-color: #219653;
    }

    .btn-cancel {
        background: none;
        border: 1px solid #3498db;
        color: #3498db;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 1.05rem;
        font-weight: 600;
        text-decoration: none;
        display: inline-block;
        transition: all 0.2s;
    }

    .btn-cancel:hover {
        background: #3498db;
        color: white;
    }

    @media (max-width: 600px) {
        .form-container {
            margin: 20px 16px;
            padding: 20px;
        }

        .form-actions {
            flex-direction: column;
        }

        .btn-submit,
        .btn-cancel {
            width: 100%;
            text-align: center;
        }
    }
</style>

<div class="form-container">
    <h1 class="form-title">{{ legend }}</h1>

    <form method="POST">
        <div class="form-group">
            <label for="category_name">Категория</label>
            <input type="text"
                   id="category_name"
                   name="category_name"
                   list="category_list"
                   value="{{ expense.category.name if expense else '' }}"
                   placeholder="Выберите или введите новую"
                   autocomplete="off"
                   class="form-control"
                   required>
            <datalist id="category_list">
                {% for categ in categories %}
                    <option value="{{ categ.name }}"></option>
                {% endfor %}
            </datalist>
        </div>

        <div class="form-group">
            <label for="amount">Сумма (₽)</label>
            <input type="number"
                   id="amount"
                   name="amount"
                   step="0.01"
                   min="0.01"
                   value="{{ expense.amount if expense else '' }}"
                   class="form-control"
                   required>
        </div>

        <div class="form-group">
            <label for="paytype">Тип оплаты</label>
            <select id="paytype" name="paytype" class="form-control">
                <option value="Карта"
                    {% if expense and expense.paytype == 'Карта' %}selected{% endif %}>
                    Карта
                </option>
                <option value="Наличные"
                    {% if expense and expense.paytype == 'Наличные' %}selected{% endif %}>
                    Наличные
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="comment">Комментарий</label>
            <textarea id="comment"
                      name="comment"
                      class="form-control"
                      placeholder="Необязательно">{{ expense.comment if expense else '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-submit">Сохранить</button>
            <a href="{{ url_for('main.expense') }}" class="btn-cancel">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
